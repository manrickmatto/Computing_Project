<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <title>Stress Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">    
</head>

<body>    
    <div class="container">        
        <form action="/result" method="POST">
            <h1> Stress Prediction</h1>
            <label for="HR">Heart Rate</label>
            <input type="number" id="HR" name="HR">
            <br><br>
             <input type="submit" value="Predict">
        </form>

        {% if prediction_text %}
            <h3 class="result">{{ prediction_text }}</h3>
        {% endif %}
    </div>
</body>
</html>
